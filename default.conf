upstream backend {
  server 172.17.0.1:9292;
}

server {
  listen 4200;

  server_name terrible-spa;

  location /api {
    proxy_pass  http://backend/api;
    add_header Access-Controll-Allow-Origin *;
  }

  location / {
      root /usr/share/nginx/html;
      index index.html index.htm;
      try_files $uri /index.html;
  }
}
