<mat-card appearance="raised" class="mat-elevation-z2">
  <mat-card-header>
    <mat-card-title>Top List</mat-card-title>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <div *ngFor="let game of topGames">
      <app-top-game [game]="game"></app-top-game>
      <mat-divider></mat-divider>
    </div>
    <mat-divider class="py-3"></mat-divider>
  </mat-card-content>
</mat-card>
