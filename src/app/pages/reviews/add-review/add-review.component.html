<mat-card appearance="raised">
  <div>
    <mat-card-header class="p-2 mx-3">
      <div class="row justify-content-end">
        <div class="col-lg-6">
          <mat-card-title>{{username}}</mat-card-title>
          <mat-card-subtitle>{{userEmail}}</mat-card-subtitle>
        </div>
        <div class="col-lg-6">
          <mat-form-field appearance="outline">
            <mat-label>Rating</mat-label>
            <mat-select [(ngModel)]="review.rating">
              <mat-option [value]="0">0</mat-option>
              <mat-option [value]="1">1</mat-option>
              <mat-option [value]="2">2</mat-option>
              <mat-option [value]="3">3</mat-option>
              <mat-option [value]="4">4</mat-option>
              <mat-option [value]="5">5</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field appearance="outline" class="col-lg-12 py-2">
        <textarea matInput
                  class="mx-2"
                  type="textarea"
                  rows="6"
                  [(ngModel)]="review.content"></textarea>
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions class="justify-content-center">
      <div class="mx-2">
        <button mat-raised-button color="accent" class="button-w200" (click)="submitReview()">Submit</button>
      </div>

      <div class="mx-2">
        <button mat-raised-button color="accent" class="button-w200" (click)="doAddNewReview()">Cancel</button>
      </div>
    </mat-card-actions>
  </div>
</mat-card>
