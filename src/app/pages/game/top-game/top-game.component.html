<mat-card class="my-2" (click)="openGame(game.id)">
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title>{{game.name}}</mat-card-title>
      <mat-card-subtitle>({{game.releaseYear}})</mat-card-subtitle>
      <img mat-card-avatar src="{{game.imgUrl}}" >
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content>
    Rating: {{game.rating}}<mat-icon class="py-1" color="accent">star</mat-icon>
  </mat-card-content>
</mat-card>
