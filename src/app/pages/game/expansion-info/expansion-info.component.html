<mat-card appearance="raised">
  <div class="d-flex">
    <mat-card-header class="col-lg-3">
      <img mat-card-lg-image src="{{expansion.imgUrl}}" alt="{{expansion.name}}">
    </mat-card-header>
    <mat-card-content class="col-lg-8">
      <mat-card-title>
        {{expansion.name}}  {{expansion.releaseDate}}
      </mat-card-title>
      {{expansion.description}}
    </mat-card-content>
  </div>
</mat-card>
