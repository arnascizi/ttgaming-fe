<div class="justify-content-center">
  <mat-card appearance="raised" class="mat-elevation-z2">
    <div class="row">
      <div class="col-lg-4">
        <mat-card-header>
          <img mat-card-lg-image src="{{game.imgUrl}}" alt="{{game.name}}"/>
        </mat-card-header>
      </div>
      <div class="col-lg-8">
        <mat-card-content>
          <div class="container">
            <div *ngIf="!edit">
              <mat-card-title>{{game.name}} ({{game.releaseYear}})</mat-card-title>
            </div>
            <mat-form-field *ngIf="edit" appearance="outline" class="col-lg-8 me-5">
              <mat-label>Game title:</mat-label>
              <input matInput type="text" [(ngModel)]="game.name"/>
            </mat-form-field>
            <mat-form-field *ngIf="edit" appearance="outline" class="col-lg-3">
              <mat-label>Release date:</mat-label>
              <input matInput type="number" [(ngModel)]="game.releaseYear"/>
            </mat-form-field>
            <mat-form-field *ngIf="edit" appearance="outline" class="col-lg-12">
              <mat-label>Description:</mat-label>
              <textarea matInput type="textarea" [(ngModel)]="game.description" rows="10"></textarea>
            </mat-form-field>
            <div *ngIf="!edit">
              <p class="card-text py-3">{{game.description}}</p>
            </div>
            <mat-card-content>
              <div class="justify-content-between">
                <div class="row">
                  <div class="my-2 col-lg-6">
                    <button mat-flat-button color="primary"><mat-icon>access_time</mat-icon>Playing time: {{game.duration}} Min.</button>
                  </div>
                  <div class="my-2 col-lg-6">
                    <button mat-flat-button color="primary"><mat-icon>person_outline</mat-icon>{{game.minPlayers}} - {{game.maxPlayers}} Players</button>
                  </div>
                </div>
                <div class="row">
                  <div class="my-2 col-lg-6">
                    <button mat-flat-button color="primary"><mat-icon>cake</mat-icon>Age: {{game.minAge}}+</button>
                  </div>
                  <div class="my-2 col-lg-6">
                    <button mat-flat-button color="primary">Rating: {{game.rating}}<mat-icon color="accent">star</mat-icon></button>
                  </div>
                </div>
              </div>
              <mat-divider class="py-2"></mat-divider>
              <mat-label>Mechanics:</mat-label>
              <mat-chip-grid>
                <mat-chip-listbox *ngFor="let mechanic of game.mechanics">
                  <mat-chip-option selectable="false"
                                   class="mx-2">{{mechanic.name}}</mat-chip-option>
                </mat-chip-listbox>
              </mat-chip-grid>
              <mat-divider class="py-2"></mat-divider>
              <mat-label>Categories:</mat-label>
              <mat-chip-grid>
                <mat-chip-listbox *ngFor="let category of game.categories">
                  <mat-chip-option selectable="false"
                                   class="mx-2">{{category.name}}</mat-chip-option>
                </mat-chip-listbox>
              </mat-chip-grid>
              <mat-divider class="py-2"></mat-divider>
              <mat-label>Designers:</mat-label>
              <mat-chip-grid>
                <mat-chip-listbox *ngFor="let designer of game.designers">
                  <mat-chip-option selectable="false"
                                   class="mx-2">{{designer.name}}</mat-chip-option>
                </mat-chip-listbox>
              </mat-chip-grid>
              <mat-divider class="py-2"></mat-divider>
              <mat-label>Publishers:</mat-label>
              <mat-chip-grid>
                <mat-chip-listbox *ngFor="let publisher of game.publishers">
                  <mat-chip-option selectable="false"
                                   class="mx-2">{{publisher.name}}</mat-chip-option>
                </mat-chip-listbox>
              </mat-chip-grid>
            </mat-card-content>
          </div>
        </mat-card-content>
      </div>
    </div>

    <mat-divider class="pt-3"></mat-divider>

    <mat-card-actions class="d-flex justify-content-center">
      <div *ngIf="!edit" class="mx-2">
        <button mat-raised-button color="accent" class="button-w200" (click)="toggleEdit()">Edit</button>
      </div>

      <div *ngIf="edit" class="mx-2">
        <button mat-raised-button color="accent" class="button-w200" (click)="updateInfo()">Save</button>
      </div>

      <div *ngIf="edit" class="mx-2">
        <button mat-raised-button color="warn" class="button-w200" (click)="openDialog()">Delete</button>
      </div>
    </mat-card-actions>
  </mat-card>

  <mat-divider class="py-3"></mat-divider>

  <mat-tab-group class="col-lg-12 mat-elevation-z2" color="primary">
    <mat-tab label="Reviews">
      <div *ngIf="game.reviews.length == 0">
        <p class="text-center py-2">There are no reviews!</p>
      </div>
      <div *ngIf="game.reviews.length != 0">
        <mat-list role="list" *ngFor="let review of game.reviews">
          <app-review-info [review]="review"></app-review-info>
          <mat-divider></mat-divider>
        </mat-list>
      </div>
      <mat-card-content>
        <div *ngIf="addNewReview">
          <app-add-review [gameId]="game.id"
                          [username]="user?.username"
                          [userEmail]="user?.email"
                          [openReview]="addNewReview"
                          (closeReview)="doAddNewReview()"></app-add-review>
        </div>
        <div *ngIf="!addNewReview && user" class="d-flex justify-content-center">
          <div *ngIf="!edit" class="mx-2">
            <button mat-raised-button color="accent" class="button-w200" (click)="doAddNewReview()">Add review</button>
          </div>
        </div>
      </mat-card-content>
    </mat-tab>
    <mat-tab label="Expansions">
      <div *ngIf="game.expansions.length == 0">
        <p class="text-center py-2">There are no expansions!</p>
      </div>
      <div *ngIf="game.expansions.length != 0">
        <mat-list role="list" *ngFor="let expansion of game.expansions">
          <app-expansion-info [expansion]="expansion"></app-expansion-info>
          <mat-divider></mat-divider>
        </mat-list>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
