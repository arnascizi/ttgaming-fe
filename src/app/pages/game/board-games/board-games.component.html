<div class="justify-content-center">
    <mat-form-field class="col-lg-12" appearance="outline">
      <input matInput
             type="text"
             [(ngModel)]="search.searchQuery"
             placeholder="Search">
      <button *ngIf="search.searchQuery"
              matSuffix
              mat-icon-button
              aria-label="Clear"
              (click)="search.searchQuery=''">
        <mat-icon>close</mat-icon>
      </button>
      <button matSuffix
              mat-icon-button
              (click)="doSearch()">
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>

    <mat-table [dataSource]="boardGames"
               class="mat-elevation-z2 games-table">
      <ng-container matColumnDef="position">
        <mat-header-cell *matHeaderCellDef
                         class="col-lg-1">#
        </mat-header-cell>
        <mat-cell *matCellDef="let element"
                  class="col-lg-1 mat-cell-height">{{boardGames.indexOf(element) + 1}}
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="title">
        <mat-header-cell *matHeaderCellDef
                         class="col-lg-7">Title
        </mat-header-cell>
        <mat-cell *matCellDef="let element"
                  class="col-lg-7 mat-cell-height"><img src="{{element.imgUrl}}"
                                                        alt="{{element.name}}">{{element.name}}
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="rating">
        <mat-header-cell *matHeaderCellDef>Rating</mat-header-cell>
        <mat-cell *matCellDef="let element"
                  class="mat-cell-height">{{element.rating}}<mat-icon class="mb-1" color="accent">star</mat-icon>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayColumns"></mat-header-row>
      <mat-row (click)="openGame(row.id)"
               *matRowDef="let row;
               columns: displayColumns;">

      </mat-row>
    </mat-table>
<!--    <div class="py-3">-->
<!--      <mat-paginator showFirstLastButtons-->
<!--                     [pageSize]="search.pageSize"-->
<!--                     color="accent">-->
<!--      </mat-paginator>-->
<!--    </div>-->

</div>
