<div class="d-flex justify-content-center">
    <mat-table [dataSource]="boardGames" class="mat-elevation-z2 games-table">

      <ng-container matColumnDef="position">
        <mat-header-cell *matHeaderCellDef class="col-lg-1">#</mat-header-cell>
        <mat-cell *matCellDef="let element" class="col-lg-1 mat-cell-height">{{boardGames.indexOf(element) + 1}}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="title">
        <mat-header-cell *matHeaderCellDef class="col-lg-7">Title</mat-header-cell>
        <mat-cell *matCellDef="let element" class="col-lg-7 mat-cell-height"><img src="{{element.imgUrl}}" alt="{{element.name}}">{{element.name}}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="rating">
        <mat-header-cell *matHeaderCellDef>Rating</mat-header-cell>
        <mat-cell *matCellDef="let element" class="mat-cell-height">{{element.rating}}</mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayColumns"></mat-header-row>
      <mat-row (click)="openGame(row.id)" *matRowDef="let row; columns: displayColumns;"></mat-row>
    </mat-table>
</div>
