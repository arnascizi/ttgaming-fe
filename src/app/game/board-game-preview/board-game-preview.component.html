<div class="container">
  <mat-card appearance="outlined" class="mat-elevation-z2">
    <mat-grid-list cols="6" rowHeight="100px">
      <mat-grid-tile colspan="1" rowspan="2">
        <img mat-card-sm-image src="{{game.imgUrl}}" alt="{{game.name}}" />
      </mat-grid-tile>
      <mat-grid-tile colspan="5" rowspan="2">
        <mat-card-header>
          <mat-card-title >{{game.name}}</mat-card-title>
          <mat-card-subtitle >{{game.releaseYear}}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content >
          <p>{{game.description}}</p>
        </mat-card-content>
      </mat-grid-tile>
    </mat-grid-list>
  </mat-card>
</div>
