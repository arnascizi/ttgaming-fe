<div class="justify-content-center">
  <mat-card appearance="raised"
            class="mat-elevation-z2">
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>

    <mat-divider class="py-3"></mat-divider>

    <mat-card-content class="d-flex justify-content-center">
      <form [formGroup]="form"
            (ngSubmit)="onSubmit()"
            class="login-form row justify-content-center">

        <div class="col-lg-6 mx-3">
          <ng-container>
            <mat-form-field appearance="outline"
                            class="w-100">
              <mat-label>Username</mat-label>
              <input matInput
                     type="text"
                     formControlName="username"
                     [ngClass]="{ 'is-invalid': submitted && form.value.username.errors}" />
              <div *ngIf="submitted && form.value.username.errors"
                   class="invalid-feedback">
                <div *ngIf="form.value.username.errors.required">Username is required</div>
              </div>
            </mat-form-field>
          </ng-container>
        </div>

        <div class="col-lg-6 mx-3">
          <ng-container>
            <mat-form-field appearance="outline"
                            class="w-100">
              <mat-label>Password</mat-label>
              <input matInput
                     type="password"
                     formControlName="password"
                     [ngClass]="{ 'is-invalid': submitted && form.value.password.errors}" />
              <div *ngIf="submitted && form.value.password.errors"
                   class="invalid-feedback">
                <div *ngIf="form.value.password.errors.required">Password is required</div>
              </div>
            </mat-form-field>
          </ng-container>
        </div>
      </form>
    </mat-card-content>

    <mat-divider class="py-3"></mat-divider>

    <mat-card-actions class="d-flex justify-content-center">
      <div class="mx-2">
        <button mat-raised-button
                type="submit"
                color="primary"
                class="button-w200"
                (click)="onSubmit()">Login
        </button>
      </div>

      <div class="mx-2">
        <button mat-raised-button
                class="button-w200"
                color="warn"
                [routerLink]="'/register'">Register
        </button>
      </div>
    </mat-card-actions>
  </mat-card>
