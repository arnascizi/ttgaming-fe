<div class="d-flex justify-content-center">
  <mat-card appearance="raised" class="mat-elevation-z2">
    <mat-card-header>
      <mat-card-title>Register</mat-card-title>
    </mat-card-header>

    <mat-divider class="py-3"></mat-divider>

    <mat-card-content class="d-flex justify-content-center">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="register-form row justify-content-center">
        <div class="col-lg-6 mx-3">
          <ng-container>
            <mat-form-field class="w-100" appearance="outline" >
              <mat-label>Email</mat-label>
                <input matInput formControlName="email" type="text">
            </mat-form-field>
          </ng-container>
        </div>

        <div class="col-lg-6 mx-3">
          <ng-container>
            <mat-form-field class="w-100" appearance="outline" >
              <mat-label>Username</mat-label>
                <input matInput formControlName="username" type="text">
            </mat-form-field>
          </ng-container>
        </div>

        <div class="col-lg-6 mx-3">
          <ng-container>
            <mat-form-field class="w-100" appearance="outline" >
              <mat-label>Password</mat-label>
                <input matInput formControlName="password" type="password">
            </mat-form-field>
          </ng-container>
        </div>
      </form>
    </mat-card-content>

    <mat-divider class="py-3"></mat-divider>

    <mat-card-actions class="d-flex justify-content-center">
      <div class="mx-2">
        <button mat-raised-button type="submit" color="primary" class="button-w200" (click)="onSubmit()">Register</button>
      </div>

      <div class="mx-2">
        <button mat-raised-button class="button-w200" color="warn" [routerLink]="'/login'">Login</button>
      </div>
    </mat-card-actions>
  </mat-card>
</div>
