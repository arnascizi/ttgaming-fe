<mat-card>
  <mat-card-header>
    <mat-card-title>Add new {{data}}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <ng-container>
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Category name:</mat-label>
        <input matInput type="text">
      </mat-form-field>
    </ng-container>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button mat-dialog-close (click)="closeDialog(false)">No</button>
    <button mat-button mat-dialog-close  (click)="closeDialog(true)">Okay</button>
  </mat-card-actions>
</mat-card>
